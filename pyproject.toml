[project]
name = "meeting-transcription"
version = "0.1.0"
description = "Browser-based meeting transcription with faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
