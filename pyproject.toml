[project]
name = "meeting-transcription"
version = "0.1.0"
description = "Browser-based meeting transcription with faster-whisper"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "funasr>=1.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "llvmlite>=0.44.0",
    "numba>=0.59.0",
    "umap-learn>=0.5.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "google-genai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
